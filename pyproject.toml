[project]
name = "energy-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arslane18", email = "ami54500@gmail.com" }
]
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "apache-airflow>=3.3.1",
    "fastapi>=0.129.0,<0.137.0",
    "graphviz>=0.21",
    "polars>=1.44.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
energy-pipeline = "energy-pipeline:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
]
